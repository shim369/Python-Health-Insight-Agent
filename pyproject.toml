[project]
name = "python-health-insight-agent"
version = "0.1.0"
description = "Data-analysis AI agent over meal/workout/sleep logs: Gemini + typed tools + a small custom model."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "health_insight_agent"
module-root = "src"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs the test PostgreSQL database"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
branch = true
source = ["health_insight_agent"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
