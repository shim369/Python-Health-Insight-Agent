[alembic]
script_location = src/health_insight_agent/database/migrations
# URLはenv.pyでDATABASE_URL環境変数から取得する(ここに接続情報を書かない)。
prepend_sys_path = src
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
