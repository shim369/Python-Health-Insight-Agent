# 開発・テスト用PostgreSQL(CIのpostgres:16と揃える)。
# ホスト側は5433。既存のローカルPostgres(5432)と衝突させないため。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_insight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初回起動時のみ実行: テスト専用DB(health_insight_test)を作る。
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
