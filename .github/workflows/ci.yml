name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_insight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # テストDB名は必ず _test で終わる(tests/conftest.py が検査する)。
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/health_insight_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # .python-version(3.15.1)を使う。mlflow(Phase 9)のpyyamlはsdistビルドになるため、
      # ここで失敗する場合のみ3.13へ後退する(docs/requirements.md 決定5)。
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Migrations (alembic upgrade head)
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest
