name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_insight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # テストDB名は必ず _test で終わる(tests/conftest.py が検査する)。
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/health_insight_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # .python-version(3.15.1)を使う。mlflow(Phase 9)のpyyamlはsdistビルドになるため、
      # ここで失敗する場合のみ3.13へ後退する(docs/requirements.md 決定5)。
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Migrations (alembic upgrade head)
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest

      # キー無しFakeでの評価。正答率が基準を下回ったら失敗させる(回帰ガード)。
      - name: Offline evaluation (rule-based baseline)
        run: uv run python -m health_insight_agent.evaluation --include-model --config fake-all --min-rate fake-all=0.85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
